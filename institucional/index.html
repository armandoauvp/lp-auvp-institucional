<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101010" />
    <meta name="color-scheme" content="light" />

    <title>
      AUVP Escola de Investimentos. A maior escola de investimentos do Brasil
    </title>
    <meta
      name="description"
      content="A AUVP forma investidores independentes, capazes de tomar suas próprias decisões financeiras e construir patrimônio com autonomia. Uma instituição criada para mudar a relação do brasileiro com o dinheiro."
    />
    <meta name="application-name" content="AUVP Escola de Investimentos" />
    <meta name="author" content="AUVP Educação Financeira" />
    <meta
      name="keywords"
      content="educação financeira,escola de investimentos,AUVP,Raul Sena,Investidor Sardinha,curso de investimentos,renda fixa,renda variável"
    />
    <meta name="creator" content="AUVP Educação Financeira" />
    <meta name="publisher" content="AUVP Educação Financeira" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />

    <!-- %VITE_SITE_URL% é trocado pelo Vite no build. Ver vite.config.ts. -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta
      property="og:title"
      content="AUVP Escola de Investimentos. A maior escola de investimentos do Brasil"
    />
    <meta
      property="og:description"
      content="A AUVP forma investidores independentes, capazes de tomar suas próprias decisões financeiras e construir patrimônio com autonomia. Uma instituição criada para mudar a relação do brasileiro com o dinheiro."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:site_name" content="AUVP Escola de Investimentos" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="AUVP Escola de Investimentos. A maior escola de investimentos do Brasil"
    />
    <meta
      name="twitter:description"
      content="A AUVP forma investidores independentes, capazes de tomar suas próprias decisões financeiras e construir patrimônio com autonomia. Uma instituição criada para mudar a relação do brasileiro com o dinheiro."
    />

    <!--
      Sentient (Fontshare / Indian Type Foundry). É a serifa do logotipo da
      AUVP e, por isso, a serifa do site. Não está no Google Fonts: vem do CDN
      da fundição, no mesmo padrão que a landing da escola usa para a Satoshi.
      A licença permite hospedar os .woff2 junto do site. Ver docs/BRAND.md.
    -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin="" />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f%5B%5D=sentient@300,400,500,700&display=swap"
    />
  </head>
  <body class="antialiased">
    <!-- O build troca o comentário abaixo pelo HTML pré-renderizado. -->
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
